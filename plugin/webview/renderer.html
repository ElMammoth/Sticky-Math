<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }
    #boot {
      font: 11px sans-serif;
      color: #666666;
      padding: 4px 12px 0;
    }
    #preview {
      display: flex;
      align-items: center;
      /* "safe": never clip the start of the content when it overflows */
      justify-content: safe center;
      min-height: 110px;
      padding: 12px;
      font-size: 28px;
      overflow: auto;
      color: #111111;
    }
    /*
     * A formula wider than the panel is scaled down so it stays fully
     * visible. Vector display scaling only: the SVG serialized for
     * insertion is not touched.
     * IMPERATIVE: target only the root SVG (the direct child of the
     * MathJax container). Stretchy characters (the braces of
     * \underbrace, large delimiters) are assembled from nested <svg>
     * elements with explicit dimensions; applying height: auto to those
     * dislocates the assembly (an extension bar running through the
     * text).
     */
    #preview mjx-container > svg {
      max-width: 100%;
      height: auto;
    }
    #err {
      color: #b00020;
      font: 12px sans-serif;
      padding: 2px 12px 8px;
      white-space: pre-wrap;
    }
  </style>
  <script src="./config.js"></script>
  <script src="./vendor/tex-svg-full.js"></script>
</head>
<body>
  <div id="boot">Chargement du moteur MathJax...</div>
  <div id="preview"></div>
  <div id="err"></div>
  <script src="./renderer.js"></script>
</body>
</html>
