<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }
    #boot {
      font: 11px sans-serif;
      color: #666666;
      padding: 4px 12px 0;
    }
    #preview {
      display: flex;
      align-items: center;
      /* "safe" : ne jamais clipper le debut du contenu quand il deborde */
      justify-content: safe center;
      min-height: 110px;
      padding: 12px;
      font-size: 28px;
      overflow: auto;
      color: #111111;
    }
    /*
     * Une formule plus large que le panneau est reduite pour rester
     * entierement visible. Reduction vectorielle d'affichage uniquement :
     * le SVG serialise pour l'insertion n'est pas touche.
     * IMPERATIF : ne cibler que le SVG racine (enfant direct du
     * conteneur MathJax). Les caracteres extensibles (accolades de
     * \underbrace, grands delimiteurs) sont assembles dans des <svg>
     * imbriques a dimensions explicites ; leur appliquer height: auto
     * disloque l'assemblage (barre d'extension a travers le texte).
     */
    #preview mjx-container > svg {
      max-width: 100%;
      height: auto;
    }
    #err {
      color: #b00020;
      font: 12px sans-serif;
      padding: 2px 12px 8px;
      white-space: pre-wrap;
    }
  </style>
  <script src="./config.js"></script>
  <script src="./vendor/tex-svg-full.js"></script>
</head>
<body>
  <div id="boot">Chargement du moteur MathJax...</div>
  <div id="preview"></div>
  <div id="err"></div>
  <script src="./renderer.js"></script>
</body>
</html>
