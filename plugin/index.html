<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <script src="main.js"></script>
</head>
<body>
  <div class="panel">

    <section class="group">
      <h2 class="group-title">Formule</h2>
      <textarea id="tex" placeholder="LaTeX, ex. : x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}" spellcheck="false"></textarea>
      <webview id="renderer" src="plugin:/webview/renderer.html"></webview>
      <div id="bridge" class="bridge"></div>
    </section>

    <section class="group">
      <h2 class="group-title">Réglages</h2>
      <div class="cols">
        <label class="field">
          <span class="label">Corps (pt)</span>
          <div class="joined">
            <input id="fontSize" type="number" min="1" max="500" step="0.5" placeholder="auto" />
            <button id="fromCursor" title="Reprendre la taille de police au curseur">Curseur</button>
          </div>
        </label>
        <label class="field">
          <span class="label">Échelle : <span id="scaleValue">100</span> %</span>
          <input id="scale" type="range" min="25" max="400" step="5" value="100" />
        </label>
      </div>
      <div class="cols">
        <label class="field">
          <span class="label">Police du texte \text{}</span>
          <div class="joined">
            <input id="mtextFont" type="text" placeholder="Défaut MathJax" />
            <button id="mtextFromCursor" title="Reprendre la famille de police au curseur">Curseur</button>
          </div>
        </label>
        <label class="field">
          <span class="label">Mode</span>
          <span class="checkline">
            <input id="display" type="checkbox" />
            <span>Display</span>
          </span>
        </label>
      </div>
    </section>

    <section class="group">
      <h2 class="group-title">Insertion</h2>
      <div class="field">
        <span class="label">Destination des SVG</span>
        <div class="joined">
          <div id="destPath" class="dest">Dossier temporaire du plugin</div>
          <button id="chooseDest">Choisir</button>
          <button id="resetDest" title="Revenir au dossier temporaire du plugin">Défaut</button>
        </div>
      </div>
      <button id="insert" class="primary" disabled>Insérer au curseur</button>
      <div id="status" class="status"></div>
    </section>

  </div>
</body>
</html>
